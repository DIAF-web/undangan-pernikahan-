                <h2>Menuju Hari Pernikahan</h2>

                <div class="countdown">
                    <div>
                        <span id="hari">0</span>
                        <p>Hari</p>
                    </div>
                    <div>
                        <span id="jam">0</span>
                        <p>Jam</p>
                    </div>
                    <div>
                        <span id="menit">0</span>
                        <p>Menit</p>
                    </div>
                    <div>
                        <span id="detik">0</span>
                        <p>Detik</p>
                    </div>
                </div>

                <p id="pesan"></p>
                    <script>

                    
                        const tanggalPernikahan = new Date("2027-06-20T10:00:00+07:00").getTime();

                        const hitungMundur = setInterval(function() {
                            const sekarang = new Date().getTime();
                            const selisih = tanggalPernikahan - sekarang;

                            if (selisih <= 0) {
                                clearInterval(hitungMundur);

                                document.getElementById("hari").textContent = "0";
                                document.getElementById("jam").textContent = "0";
                                document.getElementById("menit").textContent = "0";
                                document.getElementById("detik").textContent = "0";
                                document.getElementById("pesan").textContent =
                                    "Hari pernikahan telah tiba!";

                                return;
                            }

                            const hari = Math.floor(selisih / (1000 * 60 * 60 * 24));
                            const jam = Math.floor((selisih / (1000 * 60 * 60)) % 24);
                            const menit = Math.floor((selisih / (1000 * 60)) % 60);
                            const detik = Math.floor((selisih / 1000) % 60);

                            document.getElementById("hari").textContent = hari;
                            document.getElementById("jam").textContent = jam;
                            document.getElementById("menit").textContent = menit;
                            document.getElementById("detik").textContent = detik;
                        }, 1000);
                    </script>
    
                <form onsubmit="return validateForm()">
                   <input type="text" id="name" placeholder="cek jika nama Anda sudah masuk ke list undangan">
                    <button type="submit" class="button">Submit</button>
                </form>     

                <script>
                    function validateForm() {
                        var name = document.getElementById("name").value;
                        if (name.trim() === "aaa" || name.trim() === "bbb" || name.trim() === "ccc") {
                            alert("Nama ditemukan dalam daftar undangan.");
                            return true; // Form submit jika valid
                        }
                      else {
                        alert("Nama tidak ditemukan dalam daftar undangan.");

                </script>

            <audio id ="lolandaudio" src="lolandost.mp3" loop> </audio>
            <button id="tombolm">Toggle Music</button>
            <script>
       
                const lolandaudio = document.getElementById("lolandaudio");
                const tombolm = document.getElementById("tombolm");

                tombolm.addEventListener("click", function() {
                    if (lolandaudio.paused) {
                        lolandaudio.play();
                        tombolm.textContent = "Pause Music";
                    } else {
                        lolandaudio.pause();
                        tombolm.textContent = "Play Music";
                    }
